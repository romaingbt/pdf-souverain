global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: WARN 
  format: common

api:
  dashboard: true
  insecure: false   

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

  file:
    directory: "/dynamic"
    watch: true
